# Qwen3-0.6B / Beauty PSA setting.
grounded_model: outputs/qwen3_0.6b_beauty/isg/grounded_model
anchor_cache: outputs/qwen3_0.6b_beauty/anchors/item_anchors.pt
dataset: Beauty
data_dir: data/Beauty
output_dir: outputs/qwen3_0.6b_beauty/psa

# Gradient-ratio targets (rho), not direct additive loss coefficients.
# Paper settings: Instruments uses semantic_grad_ratio 0.015 and learning_rate
# 1.75e-4, Sports uses identity_grad_ratio 0.05, all else as below.
semantic_grad_ratio: 0.010
identity_grad_ratio: 0.030
identity_temperature: 0.07
max_aux_weight: 10.0
psa_lr_ratio: 1.0

batch_size: 128
gradient_accumulation_steps: 1
learning_rate: 0.0002
weight_decay: 0.01

# Epoch 3 of a four-epoch cosine schedule is the released checkpoint.
num_epochs: 3
scheduler_num_epochs: 4
save_epochs: [3]
warmup_ratio: 0.05
max_seq_len: 512
max_history: 20
log_steps: 50
bf16: true
grad_clip: 1.0
gradient_checkpointing: false
dataloader_num_workers: 4
seed: 42

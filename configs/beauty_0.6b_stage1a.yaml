# Final Qwen3-0.6B / Beauty Stage 1a setting.
model_name: Qwen/Qwen3-0.6B
dataset: Beauty
data_dir: data/Beauty
output_dir: outputs/qwen3_0.6b_beauty/stage1a

# Align directly in the 1024-dimensional model hidden space.
d_proj: 1024
projection_type: identity
predictor_type: linear
jepa_loss_type: cosine
ema_tau: 0.999
sid_init_strategy: mean

batch_size: 256
learning_rate: 0.0015
weight_decay: 0.01
num_epochs: 10
warmup_ratio: 0.05
max_text_len: 128
max_sid_len: 16
use_var_reg: false
var_reg_weight: 0.1
log_steps: 50
bf16: true
grad_clip: 1.0
dataloader_num_workers: 4
seed: 42

# The final aligned checkpoint is sufficient for Stage 1b.
save_each_epoch: false

# Qwen3-0.6B / Beauty GSA setting.
grounded_model: outputs/qwen3_0.6b_beauty/isg/grounded_model
anchor_cache: outputs/qwen3_0.6b_beauty/anchors/item_anchors.pt
dataset: Beauty
data_dir: data/Beauty
output_dir: outputs/qwen3_0.6b_beauty/gsa

# Gradient-ratio targets, not direct additive loss coefficients.
dsa_grad_ratio: 0.010
dsa_loss_type: catalog_ce
dsa_temperature: 0.07
hpp_grad_ratio: 0.03
hpp_temperature: 0.07
hpp_scope: remaining
hpp_level_weights: [1.0, 1.0, 1.0, 1.0]
hpp_state_weights: [1.0, 1.0, 1.0, 1.0]
max_aux_weight: 10.0
hpp_lr_ratio: 1.0

batch_size: 128
learning_rate: 0.0002
weight_decay: 0.01

# Epoch 3 from the original four-epoch LR trajectory is the released checkpoint.
num_epochs: 3
scheduler_num_epochs: 4
save_epochs: [3]
warmup_ratio: 0.05
max_seq_len: 512
max_history: 20
log_steps: 50
bf16: true
grad_clip: 1.0
gradient_checkpointing: false
dataloader_num_workers: 4
seed: 42

# Qwen3-0.6B / Beauty ISG setting.
model_name: Qwen/Qwen3-0.6B
dataset: Beauty
data_dir: data/Beauty
output_dir: outputs/qwen3_0.6b_beauty/isg

# Frozen backbone. Only the SID embedding rows and the linear predictor train.
predictor_type: linear
sid_init_strategy: mean

batch_size: 256
learning_rate: 0.0015
weight_decay: 0.01
num_epochs: 10
warmup_ratio: 0.05
max_text_len: 128
max_sid_len: 32
log_steps: 50
bf16: true
grad_clip: 1.0
dataloader_num_workers: 4
seed: 42

# The final grounded checkpoint is sufficient for PSA.
save_each_epoch: false
